[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appscope"
version = "1.0.0"
description = "GitHub App privilege audit and supply-chain credential leakage scanner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Professor Bug & Blackbox R&D" }]
dependencies = ["requests>=2.31.0", "pydantic>=2.0.0", "rich>=13.0.0", "PyJWT>=2.8.0", "cryptography>=41.0.0"]

[project.scripts]
appscope = "appscope.cli:main"
